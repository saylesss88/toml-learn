# The final boss for v1. Multi-line arrays + [[bin]] will break the
# line-based parser. That's expected — it's the reason for phase 2.
[package]
name = "jj-example"
version = "0.3.1"
edition = "2021"
authors = ["Tom <tom@example.com>"]
keywords = [
    "jj",
    "cli",
]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
local-thing = { path = "../local-thing", optional = true }

[dev-dependencies]
insta = "1"

[[bin]]
name = "jj-example"
path = "src/main.rs"
